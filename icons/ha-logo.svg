<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="presentation">
  <!-- Custom smart-home icon: Outlined House + Connected Graph (Nodes & Vertices) -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square badge -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#bg-grad)"/>
  <!-- House roof and walls -->
  <path d="M60 24 L24 53 H35 V88 C35 91.3 37.7 94 41 94 H79 C82.3 94 85 91.3 85 88 V53 H96 L60 24 Z"
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Graph edges (connections between vertices) -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <line x1="60" y1="48" x2="46" y2="66"/>
    <line x1="60" y1="48" x2="74" y2="63"/>
    <line x1="46" y1="66" x2="74" y2="63"/>
    <line x1="46" y1="66" x2="62" y2="80"/>
    <line x1="74" y1="63" x2="62" y2="80"/>
  </g>
  <!-- Graph nodes (vertices) -->
  <g fill="#ffffff">
    <circle cx="60" cy="48" r="5"/>
    <circle cx="46" cy="66" r="5"/>
    <circle cx="74" cy="63" r="5"/>
    <circle cx="62" cy="80" r="5"/>
  </g>
</svg>
